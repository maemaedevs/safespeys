<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Write an entry · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <!-- write.html writes a new entry. write.html?id=... edits an existing one. -->
  <main class="page">
    <div class="page-head">
      <div>
        <h1 id="page-title">Write an entry</h1>
        <p class="intro" id="page-intro">Take your time. You can come back and edit it later.</p>
      </div>
    </div>

    <form id="entry-form" class="page-body stack-lg" novalidate>
      <div id="form-message"></div>
      <div id="kind-field"></div>
      <div id="category-field"></div>

      <div>
        <label class="field-label" for="title">Title</label>
        <p class="hint" id="title-hint">A few words you’ll recognize later. Only you see it.</p>
        <input class="input" id="title" name="title" maxlength="120" aria-describedby="title-hint" required>
        <p class="field-error" id="title-error"></p>
      </div>

      <div>
        <label class="field-label" for="body">In your own words</label>
        <p class="hint" id="body-hint">
          Write it the way you would tell a friend. English, Filipino, or both is fine. Leave out names, schools, and
          workplaces so no one can be recognized.
        </p>
        <textarea class="input" id="body" name="body" rows="14" aria-describedby="body-hint budget-count" required></textarea>
        <span class="budget-track" aria-hidden="true"><span class="budget-fill" id="budget-fill"></span></span>
        <p class="budget-count" id="budget-count" aria-live="polite"></p>
        <p class="field-error" id="body-error"></p>
      </div>

      <div id="intensity-field"></div>
      <div id="feelings-field"></div>
      <div id="told-field"></div>

      <div class="row section-rule" style="padding-top: 1.5rem">
        <button type="submit" class="btn btn-cloth" id="submit-button">Save entry</button>
        <p class="small faint">Only you can read this.</p>
      </div>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/write.js"></script>
</body>
</html>
