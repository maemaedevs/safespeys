<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Take part · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <main class="page auth">
    <h1>Take part</h1>
    <p class="muted mt-1">
      Your email is only for signing in. It is never shown to researchers. Use one that doesn’t include your name if you
      prefer.
    </p>

    <form id="register-form" class="stack-sm mt-4" novalidate>
      <div id="form-message"></div>
      <div>
        <label class="field-label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" id="email-error"></p>
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <p class="hint" id="password-hint">At least 10 characters.</p>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint" required>
        <p class="field-error" id="password-error"></p>
      </div>
      <div>
        <label class="field-label" for="confirmPassword">Confirm password</label>
        <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        <p class="field-error" id="confirmPassword-error"></p>
      </div>
      <div>
        <label class="check">
          <input type="checkbox" name="adult" required>
          <span>I am 18 years old or older.</span>
        </label>
        <p class="field-error" id="adult-error"></p>
      </div>
      <button type="submit" class="btn btn-cloth full">Create account</button>
    </form>

    <p class="footer-note">Already taking part? <a href="login.html">Sign in</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
