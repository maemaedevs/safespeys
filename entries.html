<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>My entries · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>My entries</h1>
        <p class="intro" id="intro" hidden></p>
      </div>
      <a href="write.html" class="btn btn-cloth" id="write-button" hidden>Write an entry</a>
    </div>

    <div class="page-body">
      <div id="empty" class="measure" hidden>
        <h2>Nothing written yet</h2>
        <p class="muted mt-1">
          Start with whatever is on your mind: something that happened, or a decision you keep going back and forth on. It
          doesn’t need to be long or polished.
        </p>
        <a href="write.html" class="btn btn-cloth mt-3">Write your first entry</a>
      </div>
      <ol id="entry-list" class="entry-list" hidden></ol>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/entries.js"></script>
</body>
</html>
