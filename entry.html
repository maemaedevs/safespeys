<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Entry · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <!-- entry.html?id=... shows one entry. -->
  <main class="page">
    <a href="entries.html" class="small muted">All entries</a>

    <article class="mt-2">
      <header style="border-bottom: 1px solid var(--ink); padding-bottom: 1rem">
        <h1 id="entry-title"></h1>
        <p class="meta mt-1" id="entry-meta"></p>
      </header>

      <div class="prose-entry mt-4" id="entry-body"></div>

      <dl class="facts">
        <div><dt>How heavy</dt><dd id="fact-intensity"></dd></div>
        <div><dt>Feelings</dt><dd id="fact-feelings"></dd></div>
        <div><dt>Told anyone</dt><dd id="fact-told"></dd></div>
      </dl>

      <div class="row-top mt-4">
        <a class="btn btn-plain" id="edit-link">Edit</a>
        <details>
          <summary class="btn btn-plain">Delete</summary>
          <div class="panel-danger mt-1">
            <p>This entry will be permanently deleted, along with any AI reply. This can’t be undone.</p>
            <button type="button" class="btn btn-danger mt-2" id="delete-button">Delete this entry</button>
          </div>
        </details>
      </div>
    </article>

    <section aria-labelledby="reply-heading" class="section-rule" style="margin-top: 4rem">
      <h2 id="reply-heading">A reply</h2>
      <div id="reply"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/pages/entry.js"></script>
</body>
</html>
