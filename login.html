<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <main class="page auth">
    <h1>Sign in</h1>

    <form id="login-form" class="stack-sm mt-4" novalidate>
      <div id="form-message"></div>
      <div>
        <label class="field-label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" id="email-error"></p>
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" id="password-error"></p>
      </div>
      <button type="submit" class="btn btn-cloth full">Sign in</button>
    </form>

    <p class="footer-note">New here? <a href="register.html">Take part in the study</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
