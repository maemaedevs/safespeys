<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Study overview · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <main class="page wide">
    <div class="page-head">
      <div>
        <h1>Study overview</h1>
        <p class="intro">
          Combined results from consenting respondents. Story text, emails, and individual answers are never shown here.
          Any count under 3 is hidden as <span class="suppressed">&lt;3</span>.
        </p>
      </div>
    </div>

    <div class="page-body">
      <dl class="stat-row" id="stats"></dl>

      <div id="no-respondents" class="mt-4 measure" hidden>
        <h2>No respondents yet</h2>
        <p class="muted mt-1">
          Tables appear here once participants register, consent, and start writing. Share the study link to begin.
        </p>
      </div>

      <div id="tables" class="tables-grid" hidden></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
