<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4434">
  <meta name="robots" content="noindex, nofollow">
  <title>Account · SafeSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header on-cloth"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Account</h1>
        <p class="intro" id="intro"></p>
      </div>
    </div>

    <div class="page-body stack-xl">
      <section aria-labelledby="profile-heading">
        <h2 id="profile-heading">Your profile</h2>
        <p class="muted mt-1">If something has changed, update it here.</p>
        <form id="profile-form" class="stack mt-3" novalidate>
          <div id="profile-fields" class="stack"></div>
          <div class="row">
            <button type="submit" class="btn btn-cloth">Save profile</button>
            <p id="profile-message"></p>
          </div>
        </form>
      </section>

      <section aria-labelledby="ai-heading" class="section-rule" id="ai-section" hidden>
        <h2 id="ai-heading">AI replies</h2>
        <p class="muted mt-1 measure" id="ai-status"></p>
        <button type="button" class="btn mt-2" id="ai-toggle"></button>
      </section>

      <section aria-labelledby="consent-heading" class="section-rule">
        <h2 id="consent-heading">Consent and your data</h2>
        <p class="muted mt-1 measure" id="consent-status"></p>
        <p class="muted mt-2 measure" id="erase-explain"></p>

        <details class="mt-3" id="erase-details">
          <summary class="btn btn-plain text-maroon">Withdraw and erase my account</summary>
          <form id="erase-form" class="panel-danger stack-sm mt-2" novalidate>
            <div>
              <label class="field-label" for="password">Enter your password to confirm</label>
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
              <p class="field-error" id="password-error"></p>
            </div>
            <button type="submit" class="btn btn-danger">Erase everything</button>
          </form>
        </details>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/pages/account.js"></script>
</body>
</html>
